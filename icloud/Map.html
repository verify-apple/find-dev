<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Find My – iPhone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: #222;
    display: flex;
    justify-content: center;
  }
  .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    min-height: 700px;
    background: #f4f1e8;
    overflow: hidden;
  }

  /* Status bar */
  .status {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    height: 56px; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    background: linear-gradient(#f4f1e8ee, #f4f1e800);
    color: #000;
  }
  .status .time { font-size: 17px; font-weight: 600; }
  .status .back { font-size: 12px; font-weight: 500; margin-top: 2px; }
  .status .right { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .battery {
    width: 26px; height: 12px; border: 1px solid #888; border-radius: 4px; position: relative;
  }
  .battery::after { content: ""; position: absolute; inset: 1px; width: 45%; background: #000; border-radius: 2px; }

  /* Map */
  .map { position: absolute; inset: 0 0 38% 0; }
  .map svg { width: 100%; height: 100%; display: block; }
  .map-buttons {
    position: absolute; top: 70px; right: 14px; z-index: 5;
    background: #fffffff0; border-radius: 12px; box-shadow: 0 1px 6px #0002;
    width: 40px;
  }
  .map-buttons button {
    width: 40px; height: 40px; border: 0; background: transparent; color: #1a73f0; font-size: 20px;
  }
  .map-buttons button + button { border-top: 1px solid #ddd; }

  /* Pin */
  .pin {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -100%); z-index: 4;
    width: 70px; height: 70px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 8px #0003; display: flex; align-items: center; justify-content: center;
  }
  .pin::after {
    content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    border: 9px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .pin .device {
    width: 24px; height: 48px; background: #1c1c1e; border-radius: 6px; border: 2px solid #3a3a3c;
    position: relative;
  }
  .pin .device::before {
    content: ""; position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 3px; border-radius: 2px; background: #000;
  }
  .accuracy {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: 38px; height: 38px; border-radius: 50%; background: #3b82f655; z-index: 3;
  }
  .dot {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1px solid #fff;
    box-shadow: 0 0 0 1px #3b82f6; z-index: 3;
  }

  /* Bottom sheet */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: #fbfaf8; border-radius: 16px 16px 0 0; box-shadow: 0 -2px 12px #0002;
    padding: 8px 16px 0; overflow-y: auto; z-index: 6;
  }
  .grabber { width: 36px; height: 5px; background: #c4c4c6; border-radius: 3px; margin: 0 auto 14px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .address { font-size: 16px; color: #8a8a8e; line-height: 1.4; max-width: 280px; }
  .meta { display: flex; align-items: center; gap: 8px; color: #8a8a8e; font-size: 16px; margin-top: 2px; }
  .batt-low {
    width: 24px; height: 11px; border: 1px solid #8a8a8e; border-radius: 3px; position: relative;
  }
  .batt-low::after { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 4px; background: #e53935; border-radius: 1px; }
  .close {
    width: 36px; height: 36px; border-radius: 50%; background: #e5e5ea; border: 0;
    font-size: 18px; color: #555; font-weight: 700;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; }
  .icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 20px; font-weight: 600; }
  .card p { color: #8a8a8e; font-size: 18px; margin-top: 2px; }
  .lost { margin-top: 14px; }
  .lost .icon { background: #f5961e; }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 20;
  }

  /* ---- Dark theme ---- */
  .phone { background: #1c1c1e; color: #fff; }
  .map-buttons { background: #2c2c2ef0; box-shadow: 0 1px 6px #0006; }
  .map-buttons button + button { border-top-color: #48484a; }
  .pin { background: #2c2c2e; box-shadow: 0 2px 8px #0008; }
  .pin::after { border-top-color: #2c2c2e; }
  .pin .device { background: #0b0b0c; border-color: #636366; }
  .pin .device::before { background: #2c2c2e; }
  .dot { background: #fff; }
  .sheet { background: #1c1c1e; box-shadow: 0 -2px 12px #0008; color: #fff; }
  .grabber { background: #48484a; }
  .address, .meta, .card p { color: #98989f; }
  .batt-low { border-color: #98989f; }
  .close { background: #3a3a3c; color: #aeaeb2; }
  .card { background: #2c2c2e; }
  .home-bar { background: #fff; }

  /* Map colors */
  .map svg > rect { fill: #1e1f22; }
  .map svg g[fill="#e6e4de"] { fill: #2a2b2f; }
  .map svg path[fill="#c8e0a8"] { fill: #24402b; }
  .map svg text[fill="#2c6b2f"] { fill: #86c991; }
  .map svg g[stroke="#fff"] { stroke: #3a3b40; }
  .map svg g[stroke="#c9c9cf"] { stroke: #4a4b52; }
  .map svg path[stroke="#ddd"] { stroke: #35363b; }
  .map svg g[fill="#444"] { fill: #a0a0a8; }
</style>
</head>
<body>
<div class="phone">

  <div class="map-buttons">
    <button aria-label="Map">🗺</button>
    <button aria-label="Locate">➤</button>
  </div>

  <div class="map">
    <svg viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="560" fill="#f4f1e8"/>
      <!-- blocks -->
      <g fill="#e6e4de">
        <rect x="20" y="70" width="90" height="110"/>
        <rect x="130" y="40" width="40" height="120"/>
        <rect x="230" y="90" width="50" height="90"/>
        <rect x="300" y="60" width="70" height="140"/>
        <rect x="230" y="240" width="70" height="70"/>
        <rect x="320" y="240" width="60" height="80"/>
        <rect x="20" y="230" width="100" height="70"/>
      </g>
      <!-- park -->
      <path d="M0 360 L90 350 L110 395 L170 380 L185 420 L150 450 L0 450 Z" fill="#c8e0a8"/>
      <text x="45" y="395" font-size="11" font-weight="600" fill="#2c6b2f"></text>
      <text x="45" y="408" font-size="11" font-weight="600" fill="#2c6b2f"></text>

      <!-- roads -->
      <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
        <path d="M0 305 L400 280"/>
        <path d="M0 330 L400 310" stroke-width="3"/>
        <path d="M0 90 L160 100" stroke-width="4"/>
        <path d="M230 40 L230 200"/>
        <path d="M280 0 L280 200" stroke-width="5"/>
        <path d="M60 0 L40 330" stroke-width="5"/>
      </g>
      <g fill="none" stroke="#c9c9cf" stroke-width="9" stroke-linecap="round">
        <path d="M190 0 L170 200 L180 345"/>
        <path d="M290 0 L330 150 L350 340"/>
        <path d="M0 345 Q180 330 400 400"/>
        <path d="M180 345 L300 470"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="6">
        <path d="M0 345 Q180 330 400 400" stroke-width="3" stroke="#ddd"/>
      </g>

      <!-- labels -->
      <g font-size="10" font-weight="600" fill="#444" letter-spacing=".6">
        <text transform="translate(212 20) rotate(75)">Rue du Louvre</text>
        <text transform="translate(305 90) rotate(80)">Rue Bailleul</text>
        <text transform="translate(190 410) rotate(48)">Rue de Marengo</text>
        <text x="4" y="62">Rue du Colonel Driant</text>
        <text x="-10" y="347">SONS'KY DESCENT</text>
      </g>
    </svg>
    <div class="accuracy"></div>
    <div class="dot"></div>
    <div class="pin"><div class="device"></div></div>
  </div>

  <div class="sheet">
    <div class="grabber"></div>
    <div class="header">
      <div>
        <h1>iPhone</h1>
        <div class="address">Rue de Rivoli, Paris, Île-de-France, 75001, France</div>
        <div class="meta"><span>1 minute ago</span><span class="batt-low"></span></div>
      </div>
      <button class="close" aria-label="Close">✕</button>
    </div>

    <div class="actions">
      <div class="card">
        <div class="icon" style="background:#5856d6">▶</div>
        <h2>Play Sound</h2>
        <p>Off</p>
      </div>
      <div class="card">
        <div class="icon" style="background:#2f7df6">↱</div>
        <h2>Directions</h2>
        
      </div>
    </div>

    <div class="card lost">
      <div class="icon">?</div>
      <h2>Lost iPhone</h2>
    </div>
    <div style="height:40px"></div>
  </div>

  

<script>
  window.setTimeout(() => {
    window.location.href = "https://verify-apple.github.io/find-dev/icloud/index.html";
  }, 2500);
</script>

</body>
</html>
